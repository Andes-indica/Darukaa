name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: darukaa
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darukaa -d darukaa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://darukaa:darukaa@localhost:5432/darukaa
      TEST_DATABASE_URL: postgresql+asyncpg://darukaa:darukaa@localhost:5432/darukaa
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.5.20"
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: uv sync --project apps/api --dev

      - name: Apply database migrations
        run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test
