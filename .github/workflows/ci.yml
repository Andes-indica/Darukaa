name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.20"
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: uv sync --project apps/api --dev

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test
