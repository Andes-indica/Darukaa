[project]
name = "darukaa-api"
version = "0.1.0"
description = "Geospatial project analytics API for Darukaa.Earth"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0,<2",
  "asyncpg>=0.30.0,<1",
  "email-validator>=2.2.0,<3",
  "fastapi[standard]>=0.115.6,<1",
  "geoalchemy2>=0.16.0,<1",
  "pydantic-settings>=2.7.0,<3",
  "pyjwt[crypto]>=2.10.1,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3"
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1",
  "httpx>=0.28.1,<1",
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.25.0,<1",
  "ruff>=0.8.4,<1"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
